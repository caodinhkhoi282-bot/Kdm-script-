<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDM TEAM | SCRIPT VAULT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --bg-dark: #07090e;
            --panel-bg: rgba(13, 17, 26, 0.95);
            --panel-border: rgba(0, 255, 204, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(7, 9, 14, 0.88), rgba(7, 9, 14, 0.88)),
                url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiahhXx_WfqflsefVHlGb__ibR4gHFT_N266mSqHNWIfS5FAJtHI3YPvw&s=10');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout */
        header {
            background: rgba(10, 14, 23, 0.95);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 25px var(--primary-glow);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            object-fit: cover;
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary);
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--primary);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn-add-main {
            background: linear-gradient(135deg, var(--accent), #b3003b);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-add-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        /* Search Bar */
        .controls-bar {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            backdrop-filter: blur(8px);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: rgba(5, 7, 12, 0.7);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Script Grid */
        .script-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 640px) {
            .script-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .script-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Script Card */
        .script-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .script-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .card-header {
            margin-bottom: 12px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            color: #fff;
            font-weight: 700;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .code-preview {
            background: rgba(4, 6, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #a6accd;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            gap: 8px;
        }

        .btn-card {
            flex: 1;
            padding: 9px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background: var(--primary);
            color: #000;
        }

        .btn-copy:hover {
            background: #00ccb4;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-delete {
            background: rgba(255, 0, 85, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            max-width: 40px;
        }

        .btn-delete:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Footer Telegram Button */
        footer {
            background: rgba(10, 14, 23, 0.95);
            border-top: 1px solid var(--panel-border);
            padding: 25px 20px;
            text-align: center;
            margin-top: 50px;
            backdrop-filter: blur(10px);
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #0088cc, #005f99);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 12px;
            border: 1px solid #00bfff;
        }

        .telegram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.7);
            background: linear-gradient(135deg, #0099ff, #0073b1);
        }

        .footer-copy {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Modal Popup chung */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
            border-radius: 14px;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(5, 7, 12, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            font-family: 'Fira Code', monospace;
            resize: vertical;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--primary-glow);
            margin-top: 10px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="brand">
                <img src="https://i.postimg.cc/Hkgmx2xz/logo.jpg" alt="KDM Logo" class="brand-logo">
                <div class="brand-text">
                    <h1>KDM TEAM</h1>
                    <p>SCRIPT VAULT SYSTEM</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-add-main" onclick="openAuthModal()">
                    <i class="fa-solid fa-plus"></i> Thêm Script
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Search Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm tên script hoặc từ khóa..." oninput="renderScripts()">
            </div>
        </div>

        <!-- Script Cards Grid -->
        <div class="script-grid" id="scriptGrid"></div>
    </div>

    <!-- Footer -->
    <footer>
        <a href="https://t.me/KDMTEAM" target="_blank" class="telegram-btn">
            <i class="fa-brands fa-telegram fa-lg"></i> Tham gia nhóm Telegram
        </a>
        <p class="footer-copy">&copy; KDM TEAM SCRIPT VAULT. All rights reserved.</p>
    </footer>

    <!-- Modal Nhập Mật Mã Quản Trị -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 380px;">
            <div class="modal-header">
                <h3 class="modal-title">XÁC THỰC QUẢN TRỊ</h3>
                <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Nhập mật mã quản trị</label>
                <input type="password" id="authPasswordInput" placeholder="Nhập mật mã...">
            </div>
            <button type="button" class="btn-submit" onclick="verifyPassword()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- Modal Thêm Script -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">THÊM SCRIPT MỚI</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="addScriptForm" onsubmit="saveScript(event)">
                <div class="form-group">
                    <label>Tên Script</label>
                    <input type="text" id="scriptTitle" placeholder="VD: Redz Hub Auto Farm" required>
                </div>
                <div class="form-group">
                    <label>Mô Tả Ngắn</label>
                    <input type="text" id="scriptDesc" placeholder="VD: Hack Farm FAST, Auto Chest...">
                </div>
                <div class="form-group">
                    <label>Mã Code / Link Script (loadstring...)</label>
                    <textarea id="scriptCode" placeholder="loadstring(game:HttpGet('...'))()" required></textarea>
                </div>
                <button type="submit" class="btn-submit">LƯU SCRIPT</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">Đã sao chép Script thành công!</div>

    <script>
        const defaultScripts = [];
        let actionType = ''; // 'add' hoặc id của script cần xóa
        let targetDeleteId = null;

        function getScripts() {
            const saved = localStorage.getItem('kdm_scripts');
            if (!saved) {
                localStorage.setItem('kdm_scripts', JSON.stringify(defaultScripts));
                return defaultScripts;
            }
            return JSON.parse(saved);
        }

        function renderScripts() {
            const scripts = getScripts();
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            const filtered = scripts.filter(item => {
                return item.title.toLowerCase().includes(searchKeyword) || 
                       item.desc.toLowerCase().includes(searchKeyword);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px 20px;">
                    <i class="fa-solid fa-code" style="font-size: 2.5rem; margin-bottom: 12px; color: var(--primary);"></i>
                    <p style="font-size: 1.1rem; font-weight: 600;">Chưa có script nào được lưu!</p>
                    <p style="font-size: 0.85rem; margin-top: 5px;">Nhấn vào nút "Thêm Script" phía trên để thêm mới.</p>
                </div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h3 class="card-title">${escapeHtml(item.title)}</h3>
                        </div>
                        <p class="card-desc">${escapeHtml(item.desc || 'Không có mô tả.')}</p>
                        <div class="code-preview">${escapeHtml(item.code)}</div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-card btn-copy" onclick="copyCode('${encodeURIComponent(item.code)}')">
                            <i class="fa-regular fa-copy"></i> SAO CHÉP CODE
                        </button>
                        <button class="btn-card btn-delete" onclick="openAuthDelete(${item.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Mở bảng nhập mật khẩu cho Thêm
        function openAuthModal() {
            actionType = 'add';
            document.getElementById('authPasswordInput').value = '';
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        // Mở bảng nhập mật khẩu cho Xóa
        function openAuthDelete(id) {
            actionType = 'delete';
            targetDeleteId = id;
            document.getElementById('authPasswordInput').value = '';
            document.getElementById('authModal').classList.add('active');
        }

        // Kiểm tra mật mã khi bấm xác nhận
        function verifyPassword() {
            const password = document.getElementById('authPasswordInput').value;
            if (password === "caodinhkhoi2822015-1979") {
                closeAuthModal();
                if (actionType === 'add') {
                    document.getElementById('addModal').classList.add('active');
                } else if (actionType === 'delete' && targetDeleteId !== null) {
                    let scripts = getScripts();
                    scripts = scripts.filter(s => s.id !== targetDeleteId);
                    localStorage.setItem('kdm_scripts', JSON.stringify(scripts));
                    renderScripts();
                    showToast('Đã xóa script thành công!');
                    targetDeleteId = null;
                }
            } else {
                alert("Mật mã không chính xác!");
            }
        }

        function saveScript(e) {
            e.preventDefault();
            const title = document.getElementById('scriptTitle').value.trim();
                      const desc = document.getElementById('scriptDesc').value.trim();
            const code = document.getElementById('scriptCode').value.trim();

            if (!title || !code) return;

            const scripts = getScripts();
            const newScript = {
                id: Date.now(),
                title,
                desc,
                code
            };

            scripts.unshift(newScript);
            localStorage.setItem('kdm_scripts', JSON.stringify(scripts));
            
            closeModal();
            document.getElementById('addScriptForm').reset();
            renderScripts();
            showToast('Đã thêm Script mới thành công!');
        }

        function copyCode(encodedCode) {
            const code = decodeURIComponent(encodedCode);
            navigator.clipboard.writeText(code).then(() => {
                showToast('Đã sao chép mã Script!');
            }).catch(() => {
                showToast('Lỗi khi sao chép!');
            });
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.onload = renderScripts;
    </script>
</body>
</html>
